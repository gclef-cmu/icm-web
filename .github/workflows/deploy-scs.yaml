name: deploy-scs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Don't let two deploys scp into the AFS dir at once. Separate group from
# the Pages workflow ("pages") — the two deploys don't conflict.
concurrency:
  group: scs
  cancel-in-progress: false

jobs:
  deploy-scs:
    runs-on: ubuntu-latest
    # Normal runs finish in ~4 min; a hung runner otherwise burns the 6 h default.
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -el {0}

    steps:
      # ==== identical to deploy-book.yml from here... ====
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch pyquist submodule (public, over HTTPS)
        run: |
          # No --remote: pyquist deploys at the SHA pinned by this commit,
          # exactly like icm-text below. To ship newer pyquist, bump the
          # submodule pointer in icm-web and push.
          git config submodule.pyquist.url https://github.com/gclef-cmu/pyquist.git
          git submodule update --init pyquist

      - name: Fetch icm-text + icm-f26 submodules (pinned, over HTTPS)
        run: |
          git config submodule.icm-text.url https://github.com/chrisdonahue/pcm.git
          git config submodule.icm-f26.url "https://x-access-token:${{ secrets.ICM_F26_READ_TOKEN }}@github.com/gclef-cmu/icm-f26.git"
          git submodule update --init icm-text icm-f26

      - name: Install PortAudio (system dep of sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Restore notebook execution cache
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jcache-${{ hashFiles('environment.yml', '_config.yml', 'tools/**', 'pyquist/pyquist/**') }}-${{ github.sha }}
          restore-keys: |
            jcache-${{ hashFiles('environment.yml', '_config.yml', 'tools/**', 'pyquist/pyquist/**') }}-

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: icmbook
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      - name: Force-install TeachBooks sphinx-thebe fork
        run: |
          pip install --force-reinstall --no-deps \
            "sphinx-thebe @ git+https://github.com/TeachBooks/Sphinx-Thebe@1f3a80969622b7d63f48f05d8769f5cb933202a0"

      - name: Verify Pyquist resolves to the submodule
        run: |
          python -c "import pyquist; print('pyquist at', pyquist.__path__[0])"

      - name: Split book sources
        run: make split

      - name: Build the book
        run: make book
      # ==== ...to here (keep the comments from deploy-book.yml too) ====

      # SCS runs plain Apache: serving 404.html for unknown URLs is a GitHub
      # Pages convention, so point Apache at it explicitly. Written here, not
      # committed to the repo, to keep it out of the Pages artifact.
      # Redirects, in match order:
      #   1. the site root lands on the course home page
      #   2. /about.html is now the /book/ cover page
      #   3. textbook pages moved under /book/ (Aug 2026)
      #   4. pre-August-2026 /content/ deep links drop the prefix (a chapter
      #      link then re-enters and hits rule 3; scp never deletes, so the
      #      stale content/ tree on AFS is masked, not gone)
      #   Cache policy: the host sends no Cache-Control, so every revisit
      #   revalidated ~40 kernel files at seconds of first-byte each. Version-
      #   named and content-addressed payloads are immutable for a year; the
      #   runtime mirrors (unversioned paths, pinned contents) a week;
      #   manifests never (live-cells.js fetches them no-store anyway).
      #   Compression: the host gzips JS/CSS only; wasm and JSON shrink ~35 %.
      #   Every block is guarded so a host without the module serves as today.
      - name: Add .htaccess for custom 404 + redirects + cache policy (SCS Apache)
        run: |
          cat > _build/html/.htaccess <<'EOF'
          ErrorDocument 404 /~15322/404.html
          RedirectMatch 301 "^/~15322/?$" "/~15322/course/home.html"
          RedirectMatch 301 "^/~15322/about\.html$" "/~15322/book/"
          RedirectMatch 301 "^/~15322/(ch[0-9][0-9]|reference|appendix|errata|glossary|license|references)((/|\.).*)?$" "/~15322/book/$1$2"
          RedirectMatch 301 "^/~15322/content(/.*)?$" "/~15322$1"
          <IfModule mod_headers.c>
            <If "%{REQUEST_URI} =~ m#^/~15322/(_static/wheels/|widgets-cdn/[0-9a-f]+/)# || %{REQUEST_URI} =~ m#/anim/[^/]+-[0-9a-f]{12}\.mp4$#">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </If>
            <If "%{REQUEST_URI} =~ m#^/~15322/(pyodide|thebe-dist|plotly-dist)/#">
              Header set Cache-Control "public, max-age=604800"
            </If>
            <If "%{REQUEST_URI} =~ m#manifest\.json$#">
              Header set Cache-Control "no-cache"
            </If>
          </IfModule>
          <IfModule mod_filter.c>
            <IfModule mod_deflate.c>
              AddOutputFilterByType DEFLATE application/wasm application/json application/javascript text/css text/html image/svg+xml
            </IfModule>
          </IfModule>
          EOF

      # Runners fail resolving the SCS host when the Azure→CMU DNS path drops
      # queries (repeatedly on Aug 18 2026), and drone-scp does a single lookup
      # with no retry. Resolve here with retries — public resolvers as fallback
      # reach CMU from outside Azure — and pin the answer in /etc/hosts so the
      # scp step below needs no lookup at all. No echo: the IP would hint at
      # the masked hostname secret.
      - name: Resolve and pin SCS host DNS (runners flake on this lookup)
        # Plain shell, unlike the job's bash -el: no errexit to kill the retry
        # loop, no login profile / conda PATH involved — the step manages its
        # own exit code. -x traces each command so a failure is diagnosable
        # from the log (Actions masks the hostname secret in log output).
        shell: bash {0}
        run: |
          set -x
          host="${{ secrets.SCS_HOSTNAME }}"
          for i in $(seq 1 10); do
            for cmd in "getent ahostsv4 $host" \
                       "dig +short +time=3 +tries=1 @1.1.1.1 $host A" \
                       "dig +short +time=3 +tries=1 @8.8.8.8 $host A"; do
              ip=$($cmd 2>/dev/null | grep -Eom1 '^([0-9]{1,3}\.){3}[0-9]{1,3}')
              if [ -n "$ip" ]; then
                set +x
                echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
                exit 0
              fi
            done
            sleep 5
          done
          echo "SCS hostname never resolved" >&2
          exit 1

      - name: Copy site to SCS AFS dir
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SCS_HOSTNAME }}
          username: ${{ secrets.CHRIS_SCS_USERNAME }}
          password: ${{ secrets.CHRIS_SCS_PASSWORD }}
          port: 22
          source: _build/html/*
          target: ${{ secrets.SCS_DEPLOY_DIR }}
          strip_components: 2