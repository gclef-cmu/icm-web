name: deploy-book

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Builds are deterministic: the book only changes when the repo (incl. the
  # pinned icm-text/icm-f26 submodules) does. (pyquist temporarily floats on
  # a branch — see its fetch step.)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    # Normal runs finish in ~4 min; a hung runner otherwise burns the 6 h default.
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        # NOTE: do NOT set `submodules: true` — .gitmodules uses SSH URLs and
        # icm-f26 is private, so the default checkout can't fetch them. Each
        # submodule is fetched explicitly below over HTTPS instead (pyquist
        # and icm-text anonymously, icm-f26 with a read-token secret).

      - name: Fetch pyquist submodule (public, over HTTPS)
        run: |
          git config submodule.pyquist.url https://github.com/gclef-cmu/pyquist.git
          # No --remote: pyquist deploys at the SHA pinned by this commit,
          # exactly like icm-text below. To ship newer pyquist, bump the
          # submodule pointer in icm-web and push.
          git submodule update --init pyquist

      - name: Fetch icm-text + icm-f26 submodules (pinned, over HTTPS)
        run: |
          # URLs must be set BEFORE --init so init doesn't copy the SSH URLs
          # from .gitmodules (same trick as the pyquist step above). icm-text
          # (the public pcm repo) fetches anonymously; private icm-f26 needs
          # its read-token secret. No --remote: both stay at the SHAs pinned
          # by this commit.
          git config submodule.icm-text.url https://github.com/chrisdonahue/pcm.git
          git config submodule.icm-f26.url "https://x-access-token:${{ secrets.ICM_F26_READ_TOKEN }}@github.com/gclef-cmu/icm-f26.git"
          git submodule update --init icm-text icm-f26

      # autodoc imports pyquist.device, whose sounddevice dependency dlopens
      # PortAudio at import time — without this the build dies.
      - name: Install PortAudio (system dep of sounddevice)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # No manim/TeX Live/pango here on purpose: {animation} clips are
      # rendered at authoring time and committed under content/chNN/anim/
      # (the only tracked part of content/ch*/) — the split below reuses
      # them byte-for-byte via the content hash in their filenames.

      # Persist the jupyter-cache so a push only executes the notebooks it
      # changed. jupyter-cache invalidates per-notebook by content hash; the
      # KEY busts only when the execution environment changes (stale outputs
      # from an old environment would otherwise be served forever). The sha
      # suffix saves an updated cache each run.
      # NOTE: inert under execute_notebooks 'auto' (myst-nb only writes
      # _build/.jupyter_cache in 'cache' mode); kept for a future switch.
      - name: Restore notebook execution cache
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jcache-${{ hashFiles('environment.yml', '_config.yml', 'tools/**', 'pyquist/pyquist/**') }}-${{ github.sha }}
          restore-keys: |
            jcache-${{ hashFiles('environment.yml', '_config.yml', 'tools/**', 'pyquist/pyquist/**') }}-

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: icmbook
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"

      # conda already installed upstream sphinx-thebe (same dist name AND
      # version as the fork), so pip silently skips environment.yml's pin —
      # and upstream-built pages break the live-code layer in the browser.
      # Force the fork in; `make book`'s check-thebe-fork guards this too.
      - name: Force-install TeachBooks sphinx-thebe fork
        run: |
          pip install --force-reinstall --no-deps \
            "sphinx-thebe @ git+https://github.com/TeachBooks/Sphinx-Thebe@1f3a80969622b7d63f48f05d8769f5cb933202a0"

      # Confirm autodoc will introspect the submodule checkout, not a stray
      # copy from a wheel cache.
      - name: Verify Pyquist resolves to the submodule
        run: |
          python -c "import pyquist; print('pyquist at', pyquist.__path__[0])"

      # Regenerate content/ and _toc.yml from the pinned submodules. Reuses
      # the committed anim clips, so no manim/TeX — if a bumped icm-text
      # changed a scene without new committed clips, this fails loudly
      # asking for them.
      - name: Split book sources
        run: make split

      - name: Build the book
        run: make book

      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4